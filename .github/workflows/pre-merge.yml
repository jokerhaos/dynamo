#
# Internal (China-only self-hosted) Pre Merge CI.
#
# Pruned from upstream NVIDIA Pre Merge down to the checks this fork actually
# runs on the `0xtoken-arc-runner-set` runner: pre-commit (python lint/format
# hooks) and a rust fmt/clippy/unit-test/doc matrix. Docs/recipe/fern/operator/
# uv-hook jobs were dropped — they need Fern docs infra, XPU/GPU tester hosts,
# or upstream Docker registry pipelines this fork doesn't have.
#
# Network: the runner reaches domestic mirrors (rsproxy for crates, aliyun for
# pypi) but NOT crates.io / pypi.org / static.rust-lang.org directly. The repo
# checkouts clone token-authenticated straight from github.com: the runner
# already talks to github.com for the Actions API, and gh-proxy no longer
# forwards Basic auth for git-upload-pack — a valid token gets 401 through
# the proxy (200 direct to github.com), so proxy-routed private-repo fetches
# die on a username prompt with no tty. Public-repo tooling clones —
# pre-commit hook envs and cargo git dependencies — still route anonymously
# through gh-proxy, which serves those fine, via a global git insteadOf set
# after checkout. Each rust job writes a cargo config pointing crates.io at
# rsproxy's sparse index with git-fetch-with-cli. The rust toolchain is
# installed on the fly from rsproxy (rustup-init), so the runner image does
# not need rust pre-baked. C/cc/protoc/openssl build deps are installed at
# job start with `sudo apt-get install` (the runner runs as a
# passwordless-sudo user, apt sources already point at the TUNA ubuntu mirror);
# because runner pods are ephemeral this doesn't pollute the base runner image.
#
# Rust on this CPU runner: only lib/runtime/examples (a sub-workspace that
# doesn't transitively pull dynamo-llm) gets clippy/unit-test/doc with
# --no-default-features. dynamo-llm's default "block-manager" feature links
# nixl-sys, which hard-fails without libnixl.so/CUDA, and --no-default-features
# can't disable a DEPENDENCY's own defaults — so '.', lib/bindings/python and
# lib/bindings/kvbm can't compile here. That full default-feature compile path
# stays checked by the internal-build-push pipeline (dev image). `cargo fmt
# --all --check` at the repo root still covers whole-workspace formatting.

name: Pre Merge

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-{1}', github.workflow, github.event.pull_request.number) || format('{0}-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  PIP_INDEX_URL: https://mirrors.aliyun.com/pypi/simple/
  GH_PROXY: https://gh-proxy.com
  RS_PROXY: https://rsproxy.cn
  # Sparse-checkout cone shared by pre-commit + the rust matrix (root files are
  # always included in cone mode). Covers everything the hooks and CPU-only
  # rust checks touch. changed-files sets its own (`.github` only — it only
  # needs .github/filters.yaml + .github/actions/changed-files, and tj-actions
  # gets file lists from the REST API / git diff, not the working tree).
  SPARSE: "lib components deploy tests examples dev recipes .cargo scripts .github"
  #
  # Why every checkout is INLINE here (not a reusable .github/actions/* composite
  # referenced as astro-web3/dynamo/.github/actions/...@main): that composite is
  # fetched by the runner via codeload.github.com/<repo>/tar.gz/<sha>, and on
  # this domestic runner the private-repo tarball fetch is intermittently
  # unreachable — the runner's built-in download caps at 3×100s, so a multi-
  # minute github egress blip fails the whole run at "Set up job / Prepare all
  # required actions" before any step runs. The inline script ships in the
  # workflow file (delivered via the Actions API, no codeload) and its retry()
  # loop runs 100 attempts with backoff, riding out long outages. The cost is
  # the ~25-line checkout script duplicated per job — worth it for a reliable
  # gate on this network.

jobs:
  changed-files:
    runs-on: 0xtoken-arc-runner-set
    # tj-actions/changed-files lists changed files via the PR REST API
    # (GET /pulls/{n}/files), which needs pull-requests: read on the job
    # token — without it the API 403s with "Resource not accessible by
    # integration".
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.changes.outputs.rust }}
    steps:
      - name: Checkout (cached partial-clone mirror, depth 2)
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
          MIRROR_KEY: changed-files
          DEPTH: '2'
          SPARSE: .github
        run: |
          set -euo pipefail
          git config --global --add safe.directory '*'
          # Clone straight from github.com with the job token in the URL
          # userinfo — the proven internal-build-push approach. gh-proxy no
          # longer forwards Basic auth for git-upload-pack (verified: a valid
          # token gets 401 through the proxy, 200 direct to github.com;
          # anonymous public-repo clones still pass through it), so the old
          # insteadOf→gh-proxy + Authorization-extraheader checkout failed
          # every run with "could not read Username for
          # 'https://gh-proxy.com'". The runner does reach github.com — it
          # polls the Actions API — and token-authenticated git is not
          # rate-limited. Keep the low-speed cutoff: a stalled checkout must
          # fail loudly instead of wedging the mirror flock and backing up
          # every later run on the node.
          git config --global http.lowSpeedLimit 1024
          git config --global http.lowSpeedTime 60
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          MK="${MIRROR_KEY//\//_}"
          MIRROR="/cache/repos/${GITHUB_REPOSITORY}__${MK}"
          retry(){ local i; for i in $(seq 1 100); do "$@" && return 0; echo "::warning::attempt $i; sleep 3"; sleep 3; done; return 1; }
          seed(){ rm -rf "$MIRROR" && git clone --no-tags --depth "$DEPTH" --filter=blob:none "$url" "$MIRROR"; }
          fetch_sha(){
            find "$MIRROR/.git" -maxdepth 1 -name '*.lock' -delete 2>/dev/null || true
            git -C "$MIRROR" fetch --filter=blob:none --depth "$DEPTH" --no-tags origin "$GITHUB_SHA" && git -C "$MIRROR" checkout -f "$GITHUB_SHA"
          }
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf {} + 2>/dev/null || true
          if [ -d /cache/repos ] && [ -w /cache/repos ]; then
            # Serialize runs sharing this mirror and self-heal stale
            # .git/*.lock: cancel-in-progress kills jobs mid-fetch, which
            # otherwise wedges every later run on this volume until the
            # lock files are removed. Holding the flock makes that safe.
            MLOCK="/cache/repos/.${GITHUB_REPOSITORY//\//__}__${MK}.gitlock"
            exec 9>"$MLOCK"
            if command -v flock >/dev/null 2>&1; then flock -w 300 9 || { echo "::error::timed out waiting for the mirror lock"; exit 1; }; fi
            MARK="/cache/repos/.${GITHUB_REPOSITORY//\//__}__${MK}.seed-v4"
            if [ ! -d "$MIRROR/.git" ] || [ ! -f "$MARK" ]; then
              echo "::notice::(re)seeding mirror ($MIRROR_KEY) — one-time partial clone from github.com"
              retry seed || { echo "::error::mirror seed failed"; exit 1; }
              : > "$MARK"
            fi
            git -C "$MIRROR" remote set-url origin "$url"
            git -C "$MIRROR" sparse-checkout init --cone >/dev/null 2>&1 || true
            git -C "$MIRROR" sparse-checkout set $SPARSE
            retry fetch_sha || { echo "::error::mirror fetch/checkout failed"; exit 1; }
            cp -aT "$MIRROR/." "$GITHUB_WORKSPACE/"
          else
            echo "::notice::no /cache/repos volume — direct partial clone"
            git clone --no-tags --depth "$DEPTH" --filter=blob:none --no-checkout "$url" .
            git sparse-checkout init --cone
            git sparse-checkout set $SPARSE
            git checkout -f "$GITHUB_SHA"
          fi
      - name: Check for changes
        id: changes
        uses: ./.github/actions/changed-files
        with:
          gh_token: ${{ github.token }}

  pre-commit:
    runs-on: 0xtoken-arc-runner-set
    permissions:
      contents: read
    steps:
      - name: Checkout (cached shallow mirror, full tree)
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
          MIRROR_KEY: pre-commit
        run: |
          set -euo pipefail
          git config --global --add safe.directory '*'
          # Same rationale as the changed-files mirror: token in URL
          # userinfo direct to github.com + low-speed cutoff. gh-proxy no
          # longer forwards Basic auth for git-upload-pack (401 with a valid
          # token; anonymous public-repo clones still pass), so
          # proxy-routed private-repo fetches die on a username prompt
          # with no tty.
          git config --global http.lowSpeedLimit 1024
          git config --global http.lowSpeedTime 60
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          MK="${MIRROR_KEY//\//_}"
          MIRROR="/cache/repos/${GITHUB_REPOSITORY}__${MK}"
          retry(){ local i; for i in $(seq 1 100); do "$@" && return 0; echo "::warning::attempt $i; sleep 3"; sleep 3; done; return 1; }
          # Full shallow clone (one pack, no --filter: partial-clone would trigger
          # hundreds of per-blob on-demand fetches across the whole tree and die on
          # a flaky link). First run pays the full pack; later runs only fetch the
          # delta by SHA. No sparse — pre-commit --all-files walks the whole tree
          # (validate-skills → .agents/skills, the docs/fern/* scripts, default
          # trailing-whitespace/EOF hooks).
          seed(){ rm -rf "$MIRROR" && git clone --no-tags --depth 1 "$url" "$MIRROR"; }
          fetch_sha(){
            find "$MIRROR/.git" -maxdepth 1 -name '*.lock' -delete 2>/dev/null || true
            git -C "$MIRROR" fetch --depth 1 --no-tags origin "$GITHUB_SHA" && git -C "$MIRROR" checkout -f "$GITHUB_SHA"
          }
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf {} + 2>/dev/null || true
          if [ -d /cache/repos ] && [ -w /cache/repos ]; then
            # Serialize runs sharing this mirror and self-heal stale
            # .git/*.lock: cancel-in-progress kills jobs mid-fetch, which
            # otherwise wedges every later run on this volume until the
            # lock files are removed. Holding the flock makes that safe.
            MLOCK="/cache/repos/.${GITHUB_REPOSITORY//\//__}__${MK}.gitlock"
            exec 9>"$MLOCK"
            if command -v flock >/dev/null 2>&1; then flock -w 300 9 || { echo "::error::timed out waiting for the mirror lock"; exit 1; }; fi
            MARK="/cache/repos/.${GITHUB_REPOSITORY//\//__}__${MK}.seed-v4"
            if [ ! -d "$MIRROR/.git" ] || [ ! -f "$MARK" ]; then
              echo "::notice::(re)seeding mirror ($MIRROR_KEY) — one-time full shallow clone from github.com"
              retry seed || { echo "::error::mirror seed failed"; exit 1; }
              : > "$MARK"
            fi
            git -C "$MIRROR" remote set-url origin "$url"
            retry fetch_sha || { echo "::error::mirror fetch/checkout failed"; exit 1; }
            cp -aT "$MIRROR/." "$GITHUB_WORKSPACE/"
          else
            echo "::notice::no /cache/repos volume — direct shallow clone"
            git clone --no-tags --depth 1 "$url" .
            git checkout -f "$GITHUB_SHA"
          fi
      - name: Install python3-venv (sudo; pod is ephemeral, no base-image pollution)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3-venv
      - name: Route github clones through gh-proxy (hook envs clone from github.com)
        run: git config --global url."https://gh-proxy.com/https://github.com/".insteadOf "https://github.com/"
      - name: Install pre-commit into a venv
        run: |
          python3 -m venv "$HOME/venv"
          "$HOME/venv/bin/pip" install --quiet pre-commit
          echo "$HOME/venv/bin" >> "$GITHUB_PATH"
      - name: Run pre-commit (all files)
        # Bypass pre-commit/action: its bundled actions/cache round-trips
        # the 78MB hook-env archive through the painfully slow GitHub cache
        # service (~0.4MB/s here) and, on restore timeouts, falls into a
        # cold re-init. Keep hook environments on the persistent /cache/repos
        # volume instead — restored from local disk in seconds and shared
        # across runs. First run seeds it via gh-proxy clones (else-branch
        # keeps the ephemeral-pod default when /cache is absent).
        timeout-minutes: 25
        run: |
          set -euo pipefail
          if [ -d /cache/repos ] && [ -w /cache/repos ]; then
            # Only /cache/repos is mounted from the persistent PVC.
            export PRE_COMMIT_HOME=/cache/repos/.pre-commit
            mkdir -p "$PRE_COMMIT_HOME"
            echo "PRE_COMMIT_HOME=$PRE_COMMIT_HOME (persistent volume)"
          fi
          "$HOME/venv/bin/pre-commit" run --show-diff-on-failure --color=always --all-files

  rust:
    needs: changed-files
    if: needs.changed-files.outputs.rust == 'true'
    runs-on: 0xtoken-arc-runner-set
    strategy:
      fail-fast: false
      matrix:
        # Only CPU-safe sub-workspaces that don't transitively pull dynamo-llm
        # (whose default `block-manager` feature needs NIXL/CUDA libs not on
        # this CPU runner). `--no-default-features` does NOT disable a
        # dependency's own defaults, so '.', lib/bindings/python and
        # lib/bindings/kvbm still link nixl-sys and fail here; they stay
        # compile-checked by the build-push dev-image build. Add a crate here
        # only after confirming it's CPU-safe.
        dir: ['lib/runtime/examples']
    permissions:
      contents: read
    steps:
      - name: Checkout (cached partial-clone mirror)
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
          MIRROR_KEY: rust-${{ matrix.dir }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory '*'
          # Same rationale as the changed-files mirror: token in URL
          # userinfo direct to github.com + low-speed cutoff — gh-proxy no
          # longer forwards Basic auth for git-upload-pack (401 with a valid
          # token; anonymous public-repo clones still pass), so
          # proxy-routed private-repo fetches die on a username prompt
          # with no tty.
          git config --global http.lowSpeedLimit 1024
          git config --global http.lowSpeedTime 60
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          MK="${MIRROR_KEY//\//_}"
          MIRROR="/cache/repos/${GITHUB_REPOSITORY}__${MK}"
          retry(){ local i; for i in $(seq 1 100); do "$@" && return 0; echo "::warning::attempt $i; sleep 3"; sleep 3; done; return 1; }
          seed(){ rm -rf "$MIRROR" && git clone --no-tags --depth 1 --filter=blob:none "$url" "$MIRROR"; }
          fetch_sha(){
            find "$MIRROR/.git" -maxdepth 1 -name '*.lock' -delete 2>/dev/null || true
            git -C "$MIRROR" fetch --filter=blob:none --depth 1 --no-tags origin "$GITHUB_SHA" && git -C "$MIRROR" checkout -f "$GITHUB_SHA"
          }
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf {} + 2>/dev/null || true
          if [ -d /cache/repos ] && [ -w /cache/repos ]; then
            # Serialize runs sharing this mirror and self-heal stale
            # .git/*.lock: cancel-in-progress kills jobs mid-fetch, which
            # otherwise wedges every later run on this volume until the
            # lock files are removed. Holding the flock makes that safe.
            MLOCK="/cache/repos/.${GITHUB_REPOSITORY//\//__}__${MK}.gitlock"
            exec 9>"$MLOCK"
            if command -v flock >/dev/null 2>&1; then flock -w 300 9 || { echo "::error::timed out waiting for the mirror lock"; exit 1; }; fi
            MARK="/cache/repos/.${GITHUB_REPOSITORY//\//__}__${MK}.seed-v4"
            if [ ! -d "$MIRROR/.git" ] || [ ! -f "$MARK" ]; then
              echo "::notice::(re)seeding mirror ($MIRROR_KEY) — one-time partial clone from github.com"
              retry seed || { echo "::error::mirror seed failed"; exit 1; }
              : > "$MARK"
            fi
            git -C "$MIRROR" remote set-url origin "$url"
            git -C "$MIRROR" sparse-checkout init --cone >/dev/null 2>&1 || true
            git -C "$MIRROR" sparse-checkout set $SPARSE
            retry fetch_sha || { echo "::error::mirror fetch/checkout failed"; exit 1; }
            cp -aT "$MIRROR/." "$GITHUB_WORKSPACE/"
          else
            echo "::notice::no /cache/repos volume — direct partial clone"
            git clone --no-tags --depth 1 --filter=blob:none --no-checkout "$url" .
            git sparse-checkout init --cone
            git sparse-checkout set $SPARSE
            git checkout -f "$GITHUB_SHA"
          fi
      - name: Install build dependencies (sudo; pod is ephemeral, no base-image pollution)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config protobuf-compiler libssl-dev
      - name: Configure cargo for rsproxy + gh-proxy
        run: |
          mkdir -p "$HOME/.cargo"
          git config --global url."https://gh-proxy.com/https://github.com/".insteadOf "https://github.com/"
          printf '%s\n' \
            '[source.crates-io]' 'replace-with = "rsproxy-sparse"' \
            '[source.rsproxy-sparse]' 'registry = "sparse+https://rsproxy.cn/index/"' \
            '[net]' 'git-fetch-with-cli = true' \
            > "$HOME/.cargo/config.toml"
      - name: Install Rust toolchain from rsproxy
        # Without RUSTUP_DIST_SERVER rustup downloads toolchains from
        # static.rust-lang.org, which this runner cannot reach — the step
        # hangs forever instead of failing. Point every rustup download
        # at the rsproxy mirror and bound the step so a wedged download
        # fails loudly instead of stalling the job.
        env:
          RUSTUP_DIST_SERVER: https://rsproxy.cn
          RUSTUP_UPDATE_ROOT: https://rsproxy.cn/rustup
        timeout-minutes: 20
        run: |
          if ! command -v rustc >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://rsproxy.cn/rustup-init.sh \
              | sh -s -- -y --profile minimal --default-toolchain stable
          fi
          # GITHUB_PATH only takes effect in the NEXT step, so export here too
          # so the immediate `rustup component add` below sees the shim.
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup component add rustfmt clippy
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Verify code formatting (whole workspace)
        working-directory: .
        run: cargo fmt --all -- --check
      - name: Clippy (CPU path; no-default-features skips block-manager/CUDA/NIXL)
        working-directory: ${{ matrix.dir }}
        run: cargo clippy --locked --all-targets --no-default-features -- -D warnings
      - name: Compile + unit tests
        working-directory: ${{ matrix.dir }}
        run: cargo test --locked --all-targets --no-default-features
      - name: Doc tests
        working-directory: ${{ matrix.dir }}
        run: cargo test --locked --doc --no-default-features

  pre-merge-status-check:
    needs: [changed-files, pre-commit, rust]
    runs-on: 0xtoken-arc-runner-set
    if: always()
    steps:
      - name: "Check all dependent jobs"
        run: |
          echo '${{ toJson(needs) }}' | jq -e 'to_entries | map(.value.result) | all(. as $r | ["success","skipped"] | any($r == .))'
